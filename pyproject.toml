[project]
name = "priority-mcp"
version = "0.1.0"
description = "MCP server for the Priority Software ERP REST/OData API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["mcp", "priority", "odata", "erp"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
priority-mcp = "priority_mcp.cli:main"

[project.urls]
Documentation = "https://prioritysoftware.github.io/restapi/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: read-only calls against the public Priority sandbox",
]
